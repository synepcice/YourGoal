<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YourGoal</title>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ccff00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(20, 20, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #ccff00;
            --primary-dim: #99cc00;
            --green: #2ecc71;
            --orange: #e67e22;
            --red: #e74c3c;
            --grey: #888888;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --bg-dark: #121212;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-dark);
            background: url('/static/Rainbow.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 1rem;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary-dim); border-radius: 4px; }

        /* ─── HEADER ─── */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            flex-shrink: 0;
            z-index: 10;
        }
        .logo { font-size: 1.3rem; font-weight: 600; letter-spacing: 2px; }
        .logo span { color: var(--primary); }
        .header-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-left: auto; padding-right: 4px; }
        .icon-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.15); }
        .icon-btn i { margin-right: 4px; }
        .icon-btn.primary { background: var(--primary); color: #111; font-weight: 600; }
        .icon-btn.primary:hover { opacity: 0.9; }

        /* ─── MAIN ─── */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ─── CHILD VIEW ─── */
        .child-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            gap: 8px;
        }
        .child-home .avatar-big {
            font-size: 5rem;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(204,255,0,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .child-home .name-big {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text-dim);
        }
        .child-home .points-big {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-top: 8px;
        }
        .child-home .points-label {
            font-size: 1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        .btn-values {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 14px 32px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            width: 100%;
            max-width: 300px;
        }
        .btn-values:hover { background: rgba(255,255,255,0.12); }
        .btn-values i { color: var(--primary); margin-right: 8px; }

        /* ─── PARENT VIEW ─── */
        .parent-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 8px;
        }
        .child-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        .child-card .c-avatar {
            font-size: 2.2rem;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(204,255,0,0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .child-card .c-info {
            flex: 1;
            min-width: 0;
        }
        .child-card .c-name {
            font-size: 1rem;
            font-weight: 500;
        }
        .child-card .c-points {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-right: 8px;
        }
        .child-card .c-pts-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .child-card .c-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .pt-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
        }
        .pt-btn:active { transform: scale(0.9); }
        .pt-btn.plus { background: var(--green); color: white; }
        .pt-btn.plus:hover { opacity: 0.85; }
        .pt-btn.minus { background: var(--red); color: white; }
        .pt-btn.minus:hover { opacity: 0.85; }

        /* ─── MODALS ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 24px;
            width: 92%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 { margin: 0 0 16px; font-size: 1.2rem; }
        .modal h2 i { color: var(--primary); margin-right: 8px; }
        .modal input, .modal select {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid #555;
            padding: 10px 12px;
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: var(--primary); }
        .modal .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
        .modal .modal-actions button { flex: 1; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
        }
        .modal-close:hover { color: white; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .item-name { font-weight: 500; }
        .list-item .item-detail { font-size: 0.8rem; color: var(--text-dim); }
        .list-item .item-actions { display: flex; gap: 6px; }
        .del-btn { background: var(--red); color: white; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; }

        .value-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .value-row input {
            margin-bottom: 0;
        }
        .value-row input.vname { flex: 2; }
        .value-row input.vpts { flex: 0 0 70px; }
        .value-row input.vunit { flex: 1; }
        .value-row .del-btn { height: 36px; align-self: flex-start; }

        .value-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .value-display:last-child { border-bottom: none; }
        .value-display .vd-name { font-weight: 500; }
        .value-display .vd-rate { color: var(--primary); font-weight: 600; font-size: 1rem; }
        .value-display .vd-detail { font-size: 0.8rem; color: var(--text-dim); }

        .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
        .avatar-opt {
            font-size: 1.8rem; padding: 8px; text-align: center;
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            background: rgba(255,255,255,0.05); border: 2px solid transparent;
        }
        .avatar-opt:hover { background: rgba(255,255,255,0.12); transform: scale(1.1); }
        .avatar-opt.selected { border-color: var(--primary); background: rgba(204,255,0,0.15); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; color: var(--primary-dim); }

        @media (max-width: 480px) {
            header { padding: 6px 8px; gap: 4px; }
            .logo { font-size: 1rem; }
            .header-actions { gap: 3px; }
            .icon-btn { font-size: 0.6rem; padding: 4px 6px; }
            .icon-btn i { margin-right: 2px; }
            header img { height: 24px !important; width: 24px !important; }
            .child-home .avatar-big { font-size: 3.5rem; width: 72px; height: 72px; }
            .child-home .points-big { font-size: 3rem; }
            .child-card { padding: 12px 14px; }
            .child-card .c-avatar { font-size: 1.6rem; width: 40px; height: 40px; }
            .child-card .c-points { font-size: 1.3rem; }
            .pt-btn { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display:flex;align-items:center;gap:10px;">
            <img src="/static/Logo.png" style="height:32px;width:32px;border-radius:8px;object-fit:contain;" alt="">
            <div class="logo">Your<span>Goal</span></div>
        </div>
        <div class="header-actions" id="header-actions">
        </div>
    </header>

    <main id="main-content">
    </main>

    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
    (function() {
        let appState = {
            user: null, role: '', username: '', children: [], allUsers: [], valueTable: []
        };
        let pollTimer = null;

        function esc(text) {
            if (!text) return '';
            return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function api(path, options = {}) {
            const defaults = { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } };
            if (options.body) options.body = JSON.stringify(options.body);
            return fetch(path, { ...defaults, ...options }).then(r => {
                if (r.redirected && r.url.endsWith('/login')) { window.location = '/login'; return null; }
                return r.json();
            });
        }

        async function loadData() {
            const data = await api('/api/whoami');
            if (!data) return;
            appState.user = data;
            appState.role = data.role;
            appState.username = data.username;
            appState.children = data.children || [];
            appState.allUsers = data.all_users || [];
            appState.valueTable = data.value_table || [];
            render();
        }

        function render() {
            renderHeader();
            renderMain();
        }

        function renderHeader() {
            const el = document.getElementById('header-actions');
            const isPar = appState.role === 'parent' || appState.role === 'admin';
            let html = '';
            if (isPar) {
                html += `<button class="icon-btn" onclick="window.showEditValues()"><i class="fas fa-table"></i> Valeurs</button>`;
                html += `<button class="icon-btn" onclick="window.showManageUsers()"><i class="fas fa-users-cog"></i> Utilisateurs</button>`;
            }
            html += `<button class="icon-btn" onclick="window.showSettings()"><i class="fas fa-cog"></i></button>`;
            html += `<button class="icon-btn" onclick="location.href='/logout'"><i class="fas fa-sign-out-alt"></i></button>`;
            el.innerHTML = html;
        }

        function renderMain() {
            const el = document.getElementById('main-content');
            const isPar = appState.role === 'parent' || appState.role === 'admin';
            el.innerHTML = isPar ? renderParentView() : renderChildView();
        }

        function renderChildView() {
            const u = appState.user;
            const av = u.avatar || ((u.display_name || u.username)[0].toUpperCase());
            let html = `<div class="child-home">
                <div class="avatar-big">${av}</div>
                <div class="name-big">${esc(u.display_name)}</div>
                <div class="points-big">${u.points}</div>
                <div class="points-label">Points</div>
                <button class="btn-values" onclick="window.showValuesView()"><i class="fas fa-table"></i> Tableau des Valeurs</button>
            </div>`;
            return html;
        }

        function renderParentView() {
            const children = appState.children;
            if (children.length === 0) {
                return `<div class="empty-state"><i class="fas fa-child"></i><p>Aucun enfant pour le moment.<br>Ajoutez-en dans Utilisateurs.</p></div>`;
            }
            let html = `<div class="parent-list">`;
            const avatars = ['🐶','🐱','🐼','🐨','🦊','🐰','🦁','🐯','🐸','🐵','🦄','🐷','🐭','🐹','🐻','🦋','🐙','🦀','🐢','🐊','🦉','🐧','🐦','🐤','🐌','🐝','🐞','🦇','🐺','🐗'];
            for (const c of children) {
                const emoji = (c.avatar && avatars.includes(c.avatar)) ? c.avatar : ((c.display_name || c.username)[0].toUpperCase());
                html += `<div class="child-card">
                    <div class="c-avatar">${emoji}</div>
                    <div class="c-info">
                        <div class="c-name">${esc(c.display_name)}</div>
                        <span class="c-points">${c.points}</span> <span class="c-pts-label">pts</span>
                    </div>
                    <div class="c-actions">
                        <button class="pt-btn minus" onclick="window.adjustPoints('${esc(c.username)}',-1)" title="Enlever 1 point"><i class="fas fa-minus"></i></button>
                        <button class="pt-btn plus" onclick="window.adjustPoints('${esc(c.username)}',1)" title="Ajouter 1 point"><i class="fas fa-plus"></i></button>
                    </div>
                </div>`;
            }
            html += `</div>`;
            return html;
        }

        window.adjustPoints = async function(username, delta) {
            const res = await api('/api/users/adjust_points', { method: 'POST', body: { username, delta } });
            if (res && res.status === 'ok') {
                const child = appState.children.find(c => c.username === username);
                if (child) child.points = res.points;
                const u = appState.allUsers.find(x => x.username === username);
                if (u) u.points = res.points;
                render();
            }
        };

        window.showValuesView = function() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            const vt = appState.valueTable;
            let html = `<button class="modal-close" onclick="closeModal()">&times;</button>
                <h2><i class="fas fa-table"></i> Tableau des Valeurs</h2>`;
            if (vt.length === 0) {
                html += `<p style="color:var(--text-dim);text-align:center;">Aucune valeur configuree.</p>`;
            } else {
                for (const v of vt) {
                    const pts = v.points || 0;
                    const unit = v.unit || '';
                    html += `<div class="value-display">
                        <div>
                            <div class="vd-name">${esc(v.name)}</div>
                            ${unit ? `<div class="vd-detail">${unit}</div>` : ''}
                        </div>
                        <div class="vd-rate">${pts} pts</div>
                    </div>`;
                }
            }
            content.innerHTML = html;
            overlay.classList.add('open');
        };

        window.showEditValues = function() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            const vt = appState.valueTable;
            let html = `<button class="modal-close" onclick="closeModal()">&times;</button>
                <h2><i class="fas fa-table"></i> Editer le Tableau des Valeurs</h2>
                <p style="font-size:0.8rem;color:var(--text-dim);margin:-8px 0 12px;">Definissez les equivalences points → recompenses.</p>
                <div id="values-editor">`;
            for (let i = 0; i < vt.length; i++) {
                const v = vt[i];
                html += `<div class="value-row" data-idx="${i}">
                    <input class="vname" type="text" value="${esc(v.name)}" placeholder="Nom">
                    <input class="vpts" type="number" value="${v.points || 0}" min="1" placeholder="Pts">
                    <input class="vunit" type="text" value="${esc(v.unit || '')}" placeholder="Unite (opt)">
                    <button class="del-btn" onclick="window.removeValueRow(${i})"><i class="fas fa-times"></i></button>
                </div>`;
            }
            html += `</div>
                <button class="icon-btn" onclick="window.addValueRow()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--glass-border);background:transparent;color:var(--text);margin-bottom:12px;"><i class="fas fa-plus"></i> Ajouter une ligne</button>
                <div class="modal-actions">
                    <button class="icon-btn primary" onclick="window.saveValues()" style="padding:12px;border-radius:10px;border:none;background:var(--primary);color:#111;font-weight:600;"><i class="fas fa-save"></i> Enregistrer</button>
                </div>`;
            content.innerHTML = html;
            overlay.classList.add('open');
        };

        window.addValueRow = function() {
            const editor = document.getElementById('values-editor');
            const idx = editor.children.length;
            const div = document.createElement('div');
            div.className = 'value-row';
            div.dataset.idx = idx;
            div.innerHTML = `
                <input class="vname" type="text" placeholder="Nom">
                <input class="vpts" type="number" value="10" min="1" placeholder="Pts">
                <input class="vunit" type="text" placeholder="Unite (opt)">
                <button class="del-btn" onclick="window.removeValueRow(${idx})"><i class="fas fa-times"></i></button>
            `;
            editor.appendChild(div);
            // Update all remove buttons
            Array.from(editor.children).forEach((row, i) => {
                row.dataset.idx = i;
                const btn = row.querySelector('.del-btn');
                if (btn) btn.setAttribute('onclick', `window.removeValueRow(${i})`);
            });
        };

        window.removeValueRow = function(idx) {
            const editor = document.getElementById('values-editor');
            const rows = editor.children;
            if (idx < rows.length) {
                rows[idx].remove();
                // Re-index
                Array.from(editor.children).forEach((row, i) => {
                    row.dataset.idx = i;
                    const btn = row.querySelector('.del-btn');
                    if (btn) btn.setAttribute('onclick', `window.removeValueRow(${i})`);
                });
            }
        };

        window.saveValues = async function() {
            const editor = document.getElementById('values-editor');
            const rows = editor.querySelectorAll('.value-row');
            const table = [];
            for (const row of rows) {
                const name = row.querySelector('.vname').value.trim();
                const pts = parseInt(row.querySelector('.vpts').value) || 0;
                const unit = row.querySelector('.vunit').value.trim();
                if (name && pts > 0) {
                    table.push({ name, points: pts, unit });
                }
            }
            const res = await api('/api/values/save', { method: 'POST', body: { value_table: table } });
            if (res && res.status === 'ok') {
                appState.valueTable = res.value_table || [];
                render();
                closeModal();
            }
        };

        window.showManageUsers = function() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let html = `<button class="modal-close" onclick="closeModal()">&times;</button>
                <h2><i class="fas fa-users-cog"></i> Utilisateurs</h2>
                <div style="margin-bottom:12px;">
                    <input type="text" id="mu-username" placeholder="Login">
                    <input type="password" id="mu-password" placeholder="Mot de passe">
                    <input type="text" id="mu-display" placeholder="Prenom (affichage)">
                    <select id="mu-role"><option value="child">Enfant</option><option value="parent">Parent</option></select>
                    <button class="icon-btn primary" onclick="window.addUser()" style="width:100%;padding:10px;border-radius:8px;border:none;background:var(--primary);color:#111;font-weight:600;"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <hr style="border-color:rgba(255,255,255,0.05);margin:12px 0;">
                <h3 style="font-size:0.9rem;color:var(--text-dim);margin:0 0 8px;">Utilisateurs</h3>`;
            for (const u of appState.allUsers) {
                const isAdmin = u.is_admin;
                const roleLabel = u.role === 'parent' ? 'Parent' : 'Enfant';
                const av = (u.avatar && AVATARS.includes(u.avatar)) ? u.avatar : ((u.display_name || u.username)[0].toUpperCase());
                html += `<div class="list-item">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div onclick="window.changeUserAvatar('${esc(u.username)}')" style="font-size:1.5rem;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.05);transition:background 0.2s;" title="Changer l'icone">${av}</div>
                        <div>
                            <div class="item-name">${esc(u.display_name)} <span style="font-size:0.7rem;color:var(--text-dim);">(@${esc(u.username)})</span></div>
                            <div class="item-detail">${roleLabel}${u.role === 'child' ? ` | ${u.points} pts` : ''}</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        ${!isAdmin ? `<button class="del-btn" onclick="window.deleteUser('${esc(u.username)}')"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>`;
            }
            html += `<div style="margin-top:12px;text-align:center;color:var(--text-dim);font-size:0.8rem;">Seul l'admin peut ajouter des parents.</div>`;
            content.innerHTML = html;
            overlay.classList.add('open');
        };

        window.addUser = async function() {
            const username = document.getElementById('mu-username').value.trim().toLowerCase();
            const password = document.getElementById('mu-password').value;
            const display_name = document.getElementById('mu-display').value.trim();
            const role = document.getElementById('mu-role').value;
            if (!username || !password) return;
            const res = await api('/api/users/add', { method: 'POST', body: { username, password, display_name, role } });
            if (res && res.status === 'ok') {
                document.getElementById('mu-username').value = '';
                document.getElementById('mu-password').value = '';
                document.getElementById('mu-display').value = '';
                loadData().then(() => window.showManageUsers());
            }
        };

        window.deleteUser = async function(username) {
            if (!confirm(`Supprimer ${username} ?`)) return;
            await api('/api/users/delete', { method: 'POST', body: { username } });
            loadData().then(() => window.showManageUsers());
        };

        // ─── SETTINGS / AVATAR ───
        const AVATARS = ['🐶','🐱','🐼','🐨','🦊','🐰','🦁','🐯','🐸','🐵','🦄','🐷','🐭','🐹','🐻','🦋','🐙','🦀','🐢','🐊','🦉','🐧','🐦','🐤','🐌','🐝','🐞','🦇','🐺','🐗'];

        window.showSettings = function() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            const current = appState.user.avatar || '';
            let html = `<button class="modal-close" onclick="closeModal()">&times;</button>
                <h2><i class="fas fa-cog"></i> Paramètres</h2>
                <div style="margin-bottom:8px;"><strong>${esc(appState.user.display_name)}</strong> <span style="color:var(--text-dim);font-size:0.8rem;">(@${esc(appState.username)})</span></div>
                <h3 style="font-size:0.85rem;color:var(--text-dim);margin:0 0 4px;">Choisis ton icone</h3>
                <div class="avatar-grid">`;
            for (const a of AVATARS) {
                const sel = a === current ? 'selected' : '';
                html += `<div class="avatar-opt ${sel}" onclick="window.pickAvatar('${a}')">${a}</div>`;
            }
            html += `</div>
                <div style="margin-top:12px;text-align:center;color:var(--text-dim);font-size:0.8rem;">Clique sur un icone pour le selectionner</div>`;
            content.innerHTML = html;
            overlay.classList.add('open');
        };

        window.pickAvatar = async function(avatar) {
            await api('/api/settings', { method: 'POST', body: { avatar } });
            appState.user.avatar = avatar;
            const myEntry = appState.allUsers.find(u => u.username === appState.username);
            if (myEntry) myEntry.avatar = avatar;
            const childEntry = appState.children.find(c => c.username === appState.username);
            if (childEntry) childEntry.avatar = avatar;
            render();
            window.showSettings();
        };

        window.changeUserAvatar = function(username) {
            const current = appState.allUsers.find(u => u.username === username)?.avatar || '';
            const user = appState.allUsers.find(u => u.username === username);
            let html = `<button class="modal-close" onclick="closeModal()">&times;</button>
                <h2><i class="fas fa-user-edit"></i> Changer l'icone de ${esc(user?.display_name || username)}</h2>
                <div class="avatar-grid">`;
            for (const a of AVATARS) {
                const sel = a === current ? 'selected' : '';
                html += `<div class="avatar-opt ${sel}" onclick="window.pickUserAvatar('${esc(username)}','${a}')">${a}</div>`;
            }
            html += `</div></div>`;
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            overlay.classList.add('open');
        };

        window.pickUserAvatar = async function(username, avatar) {
            await api('/api/settings', { method: 'POST', body: { target_username: username, avatar } });
            const u = appState.allUsers.find(x => x.username === username);
            if (u) u.avatar = avatar;
            const c = appState.children.find(x => x.username === username);
            if (c) c.avatar = avatar;
            render();
            window.showManageUsers();
        };

        // ─── MODAL ───
        window.closeModal = function() {
            document.getElementById('modal-overlay').classList.remove('open');
        };

        // ─── POLLING ───
        function startPoll() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(loadData, 5000);
        }

        // ─── INIT ───
        document.addEventListener('DOMContentLoaded', () => {
            loadData().then(startPoll);
        });
    })();
    </script>
</body>
</html>
